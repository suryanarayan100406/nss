<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="The National Service Scheme unit at IIIT Naya Raipur — our website unveils at the inauguration.">
    <meta name="theme-color" content="#0F1712">
    <meta name="robots" content="noindex">
    <title>The Unveiling | NSS IIIT-NR</title>
    
    <style id="coming-soon-css">
        /* Design Tokens */
        :root {
            --ink: #0F1712;
            --pine: #182620;
            --pine-2: #20342A;
            --pine-3: #2A4A38;
            --moss: #4A6647;
            --leaf: #7FA56A;
            --marigold: #E8A63C;
            --marigold-dim: #C98A2C;
            --rust: #B6432A;
            --paper: #F1ECDC;
            --bone: #F5F1E4;
            --bone-dim: rgba(245, 241, 228, 0.72);
            --line-on-dark: rgba(245, 241, 228, 0.16);
            --font-display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
            --font-body: 'Work Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
            
            --mouseX: 0px;
            --mouseY: 0px;
        }

        /* Fonts */
        @font-face {
            font-family: 'Fraunces';
            src: url('assets/fonts/fraunces-latin-wght-normal.woff2') format('woff2'),
                 url('../../assets/fonts/fraunces-latin-wght-normal.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Fraunces';
            src: url('assets/fonts/fraunces-latin-wght-italic.woff2') format('woff2'),
                 url('../../assets/fonts/fraunces-latin-wght-italic.woff2') format('woff2');
            font-weight: normal;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: 'Work Sans';
            src: url('assets/fonts/work-sans-latin-wght-normal.woff2') format('woff2'),
                 url('../../assets/fonts/work-sans-latin-wght-normal.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--ink);
            color: var(--bone);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Full Page (Fullscreen) Button */
        .fs-btn {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 120;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.55rem 1.15rem;
            background: rgba(24, 38, 32, 0.7);
            border: 1px solid var(--moss);
            border-radius: 9999px;
            color: var(--bone);
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-user-select: none;
        }
        .fs-btn:hover {
            background: rgba(42, 74, 56, 0.85);
            border-color: var(--marigold);
            color: var(--marigold);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(232, 166, 60, 0.28);
        }
        .fs-btn:active {
            transform: translateY(0);
        }
        .fs-btn:focus-visible {
            outline: 2px solid var(--marigold);
            outline-offset: 2px;
        }
        .fs-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }
        .fs-btn:hover svg {
            transform: scale(1.12);
        }

        /* Grain Overlay */
        .grain-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            pointer-events: none;
            opacity: 0.25;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        /* Dawn Gradient Background */
        .bg-gradient {
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            z-index: -2;
            background: radial-gradient(circle at center, var(--pine-2) 0%, var(--pine) 40%, var(--ink) 80%);
            animation: dawnShift 20s infinite alternate ease-in-out;
        }
        @keyframes dawnShift {
            0% { background: radial-gradient(circle at center, var(--pine-2) 0%, var(--pine) 50%, var(--ink) 100%); }
            100% { background: radial-gradient(circle at center, var(--moss) 0%, var(--pine-3) 40%, var(--ink) 90%); }
        }

        /* Firefly Canvas */
        #fireflies {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Parallax Wrapper */
        .parallax-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform: translate(calc(var(--mouseX) * 0.05), calc(var(--mouseY) * 0.05));
            transition: transform 0.1s ease-out;
            z-index: 10;
        }

        /* Decorative Vines */
        .vine-svg {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            stroke: var(--leaf);
            stroke-width: 1.5;
            fill: none;
            opacity: 0.6;
        }
        .vine-top-left { top: 0; left: 0; width: 300px; }
        .vine-bottom-right { bottom: 0; right: 0; width: 300px; transform: rotate(180deg); }
        
        .vine-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: growVine 4s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes growVine { to { stroke-dashoffset: 0; } }

        /* Main Content Container */
        .content {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 800px;
        }

        /* Logos */
        .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            animation: sproutUp 1s ease-out 0.2s both;
        }
        .logos img {
            height: 64px;
            width: auto;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 1px solid var(--line-on-dark);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .logos img:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 0 25px var(--marigold-dim);
        }

        /* Typography */
        .org-names {
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--leaf);
            margin-bottom: 1rem;
            animation: sproutUp 1s ease-out 0.4s both;
        }
        
        .title-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
            animation: sproutUp 1s ease-out 0.6s both;
        }
        .breathing-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120%; height: 120%;
            background: radial-gradient(ellipse at center, rgba(232, 166, 60, 0.2) 0%, transparent 70%);
            z-index: -1;
            animation: breathGlow 4s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes breathGlow {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: normal;
            line-height: 1.1;
            color: var(--paper);
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        h1 em {
            color: var(--marigold);
            font-style: italic;
            position: relative;
        }
        
        /* Dew drop sparkle */
        .sparkle {
            position: absolute;
            width: 4px; height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #fff, 0 0 20px 2px var(--marigold);
            top: -10px; right: -10px;
            animation: twinkle 3s infinite;
            opacity: 0;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--bone-dim);
            margin-bottom: 3rem;
            max-width: 600px;
            margin-inline: auto;
            line-height: 1.6;
            animation: sproutUp 1s ease-out 0.8s both;
        }

        /* Countdown */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            animation: sproutUp 1s ease-out 1s both;
        }
        .cd-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            background: rgba(32, 52, 42, 0.4);
            border: 1px solid var(--moss);
            backdrop-filter: blur(8px);
            border-radius: 50% 0 50% 0; /* Seed pod / leaf shape */
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .cd-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
        }
        .cd-value {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--marigold);
            line-height: 1;
            margin-bottom: 0.2rem;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cd-item.pulse .cd-value {
            transform: scale(1.1);
            color: var(--paper);
        }
        .cd-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--leaf);
        }
        
        .cd-message {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--marigold);
            display: none;
            animation: sproutUp 1s ease-out both;
        }

        /* Local Date Display */
        .local-date {
            font-size: 0.9rem;
            color: var(--leaf);
            opacity: 0.8;
            margin-bottom: 2rem;
            animation: sproutUp 1s ease-out 1.2s both;
        }

        /* Growing Progress Indicator */
        .progress-wrapper {
            width: 100%;
            max-width: 400px;
            height: 20px;
            margin: 0 auto;
            position: relative;
            animation: sproutUp 1s ease-out 1.4s both;
        }
        .progress-track {
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 2px;
            background: var(--line-on-dark);
            transform: translateY(-50%);
        }
        .progress-vine {
            position: absolute;
            top: 50%; left: 0; height: 4px;
            background: var(--leaf);
            transform: translateY(-50%);
            width: 0%;
            border-radius: 2px;
            box-shadow: 0 0 10px var(--leaf);
            transition: width 1s ease-out;
        }
        .progress-vine::after {
            content: '';
            position: absolute;
            right: -6px; top: -4px;
            width: 12px; height: 12px;
            background: var(--marigold);
            border-radius: 50% 0 50% 0;
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--marigold);
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: var(--bone-dim);
            letter-spacing: 0.05em;
            z-index: 10;
        }

        /* Sound Indicator */
        .sound-indicator {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 4px;
            align-items: center;
            opacity: 0.5;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .sound-indicator:hover { opacity: 1; }
        .bar {
            width: 3px;
            background-color: var(--marigold);
            border-radius: 2px;
            animation: eq 1s infinite alternate ease-in-out;
        }
        .bar:nth-child(1) { height: 8px; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 16px; animation-delay: 0.3s; }
        .bar:nth-child(3) { height: 12px; animation-delay: 0.2s; }
        .bar:nth-child(4) { height: 18px; animation-delay: 0.5s; }
        @keyframes eq {
            0% { transform: scaleY(0.5); }
            100% { transform: scaleY(1); }
        }

        /* Floating Leaves CSS */
        .floating-leaf {
            position: absolute;
            width: 24px; height: 24px;
            background: var(--leaf);
            border-radius: 50% 0 50% 0;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* Animations */
        @keyframes sproutUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .bg-gradient { animation: none; }
            .breathing-glow { animation: none; }
            .bar { animation: none; }
            #fireflies { display: none; }
            .fs-btn { transition: none !important; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .countdown { gap: 0.75rem; }
            .cd-item { width: 70px; height: 70px; }
            .cd-value { font-size: 1.5rem; }
            .cd-label { font-size: 0.6rem; }
            h1 { font-size: 2.5rem; }
            .fs-btn {
                top: 1rem;
                right: 1rem;
                padding: 0.45rem 0.85rem;
                font-size: 0.75rem;
                gap: 0.4rem;
            }
            .fs-btn svg {
                width: 13px;
                height: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grain-overlay"></div>
    <canvas id="fireflies"></canvas>
    
    <!-- Full Page Control -->
    <button class="fs-btn" id="fsBtn" type="button" title="Full Page (F)" aria-label="Toggle Full Page">
        <svg class="fs-icon-enter" viewBox="0 0 24 24">
            <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        </svg>
        <svg class="fs-icon-exit" viewBox="0 0 24 24" style="display: none;">
            <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
        </svg>
        <span class="fs-label">Full Page</span>
    </button>

    <!-- Top Left Vine -->
    <svg class="vine-svg vine-top-left" viewBox="0 0 300 300">
        <path class="vine-path" d="M0,0 C100,20 150,100 150,150 C150,200 200,250 300,250 M50,15 C80,40 70,80 120,90 M100,120 C140,120 160,160 220,180" />
    </svg>
    <!-- Bottom Right Vine -->
    <svg class="vine-svg vine-bottom-right" viewBox="0 0 300 300">
        <path class="vine-path" d="M0,0 C100,20 150,100 150,150 C150,200 200,250 300,250 M50,15 C80,40 70,80 120,90 M100,120 C140,120 160,160 220,180" />
    </svg>

    <div class="parallax-wrap">
        <div class="content">
            <div class="logos">
                <img src="nss_logo.jpg" onerror="if(!this.dataset.retried){this.dataset.retried='1';this.src='../../nss_logo.jpg';}" alt="NSS Logo">
                <img src="assets/images/iiit.png" onerror="if(!this.dataset.retried){this.dataset.retried='1';this.src='../../assets/images/iiit.png';}" alt="IIIT-NR Logo">
            </div>
            
            <div class="org-names">National Service Scheme &times; IIIT Naya Raipur</div>
            
            <div class="title-wrapper">
                <div class="breathing-glow"></div>
                <h1>The <em>Unveiling<span class="sparkle"></span></em></h1>
            </div>
            
            <p class="subtitle">
                A new digital home for service and growth is taking root. Watch as our community platform blossoms into life.
            </p>

            <div id="countdown-container" class="countdown">
                <div class="cd-item" id="cd-days">
                    <span class="cd-value">00</span>
                    <span class="cd-label">Days</span>
                </div>
                <div class="cd-item" id="cd-hours">
                    <span class="cd-value">00</span>
                    <span class="cd-label">Hours</span>
                </div>
                <div class="cd-item" id="cd-mins">
                    <span class="cd-value">00</span>
                    <span class="cd-label">Mins</span>
                </div>
                <div class="cd-item" id="cd-secs">
                    <span class="cd-value">00</span>
                    <span class="cd-label">Secs</span>
                </div>
            </div>
            <div id="countdown-message" class="cd-message">The ceremony is about to begin...</div>

            <div class="local-date" id="local-date-display">Gathering temporal data...</div>

            <div class="progress-wrapper">
                <div class="progress-track"></div>
                <div class="progress-vine" id="progress-vine"></div>
            </div>
        </div>
    </div>

    <footer>IIIT Naya Raipur</footer>

    <div class="sound-indicator" title="Ambient Atmosphere Active">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <script>
        // --- 1. Parallax Effect ---
        document.addEventListener('mousemove', (e) => {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            document.documentElement.style.setProperty('--mouseX', `${x}px`);
            document.documentElement.style.setProperty('--mouseY', `${y}px`);
        });

        // --- 2. Firefly Canvas ---
        const canvas = document.getElementById('fireflies');
        const ctx = canvas.getContext('2d');
        let fireflies = [];
        let mx = window.innerWidth / 2;
        let my = window.innerHeight / 2;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });

        class Firefly {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 1;
                this.size = Math.random() * 2 + 1;
                this.life = Math.random();
                this.lifeSpeed = Math.random() * 0.02 + 0.01;
                this.color = `rgba(232, 166, 60, `; // marigold
            }
            update() {
                const dx = mx - this.x;
                const dy = my - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 300) {
                    this.vx += (dx / dist) * 0.02;
                    this.vy += (dy / dist) * 0.02;
                }
                
                this.vx *= 0.98;
                this.vy *= 0.98;
                
                this.vx += (Math.random() - 0.5) * 0.1;
                this.vy += (Math.random() - 0.5) * 0.1;

                this.x += this.vx;
                this.y += this.vy;
                
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                this.life += this.lifeSpeed;
            }
            draw() {
                const alpha = Math.abs(Math.sin(this.life)) * 0.8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + alpha + ')';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(232, 166, 60, 0.8)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) fireflies.push(new Firefly());

        function animateFireflies() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fireflies.forEach(f => {
                f.update();
                f.draw();
            });
            requestAnimationFrame(animateFireflies);
        }
        animateFireflies();

        // --- 3. Floating Leaves ---
        function createLeaf() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const leaf = document.createElement('div');
            leaf.classList.add('floating-leaf');
            leaf.style.left = Math.random() * 100 + 'vw';
            leaf.style.top = '-50px';
            
            const duration = Math.random() * 10 + 10;
            const delay = Math.random() * 5;
            const rotation = Math.random() * 360;
            
            leaf.style.animation = `
                floatDown ${duration}s ${delay}s linear forwards,
                sway ${duration/2}s ${delay}s ease-in-out infinite alternate
            `;
            leaf.style.transform = `rotate(${rotation}deg)`;
            
            const colors = ['var(--leaf)', 'var(--moss)', 'var(--pine-3)'];
            leaf.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(leaf);
            
            setTimeout(() => {
                leaf.remove();
            }, (duration + delay) * 1000);
        }

        const leafKeyframes = document.createElement('style');
        leafKeyframes.innerHTML = `
            @keyframes floatDown {
                0% { top: -50px; opacity: 0; }
                10% { opacity: 0.6; }
                90% { opacity: 0.6; }
                100% { top: 100vh; opacity: 0; }
            }
            @keyframes sway {
                0% { margin-left: 0px; transform: rotate(0deg); }
                100% { margin-left: 50px; transform: rotate(45deg); }
            }
        `;
        document.head.appendChild(leafKeyframes);

        setInterval(createLeaf, 3000);
        createLeaf();

        // --- 4. Full Page (Fullscreen) Controller ---
        const fsBtn = document.getElementById('fsBtn');
        const fsLabel = fsBtn.querySelector('.fs-label');
        const fsIconEnter = fsBtn.querySelector('.fs-icon-enter');
        const fsIconExit = fsBtn.querySelector('.fs-icon-exit');

        function isFullScreen() {
            return !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
        }

        function updateFsState() {
            if (isFullScreen()) {
                fsLabel.textContent = 'Exit Full Page';
                fsIconEnter.style.display = 'none';
                fsIconExit.style.display = 'inline-block';
                fsBtn.title = 'Exit Full Page (F or Esc)';
                fsBtn.setAttribute('aria-label', 'Exit Full Page');
            } else {
                fsLabel.textContent = 'Full Page';
                fsIconEnter.style.display = 'inline-block';
                fsIconExit.style.display = 'none';
                fsBtn.title = 'Full Page (F)';
                fsBtn.setAttribute('aria-label', 'Full Page');
            }
        }

        function toggleFullScreen() {
            if (!isFullScreen()) {
                const el = document.documentElement;
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else if (el.mozRequestFullScreen) {
                    el.mozRequestFullScreen();
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        fsBtn.addEventListener('click', toggleFullScreen);

        document.addEventListener('fullscreenchange', updateFsState);
        document.addEventListener('webkitfullscreenchange', updateFsState);
        document.addEventListener('mozfullscreenchange', updateFsState);
        document.addEventListener('MSFullscreenChange', updateFsState);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
                toggleFullScreen();
            }
        });

        // --- 5. Countdown & API Logic ---
        const els = {
            days: document.querySelector('#cd-days .cd-value'),
            hours: document.querySelector('#cd-hours .cd-value'),
            mins: document.querySelector('#cd-mins .cd-value'),
            secs: document.querySelector('#cd-secs .cd-value'),
            container: document.getElementById('countdown-container'),
            message: document.getElementById('countdown-message'),
            dateDisplay: document.getElementById('local-date-display'),
            vine: document.getElementById('progress-vine')
        };
        const items = {
            days: document.getElementById('cd-days'),
            hours: document.getElementById('cd-hours'),
            mins: document.getElementById('cd-mins'),
            secs: document.getElementById('cd-secs')
        };

        let targetDate = null;
        let isEnabled = false;
        let countdownInterval = null;
        const maxTimeMs = 30 * 24 * 60 * 60 * 1000; 

        function pulseElement(el) {
            el.classList.remove('pulse');
            void el.offsetWidth;
            el.classList.add('pulse');
        }

        function updateCountdown() {
            if (!isEnabled || !targetDate) return;
            
            const now = Date.now();
            const distance = targetDate - now;

            if (distance <= 0) {
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                els.container.style.display = 'none';
                els.message.style.display = 'block';
                els.message.innerText = 'The ceremony is about to begin.';
                els.vine.style.width = '100%';
                return;
            }

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            if (els.secs.innerText !== s.toString().padStart(2, '0')) {
                els.secs.innerText = s.toString().padStart(2, '0');
                pulseElement(items.secs);
            }
            if (els.mins.innerText !== m.toString().padStart(2, '0')) {
                els.mins.innerText = m.toString().padStart(2, '0');
                pulseElement(items.mins);
            }
            if (els.hours.innerText !== h.toString().padStart(2, '0')) {
                els.hours.innerText = h.toString().padStart(2, '0');
                pulseElement(items.hours);
            }
            if (els.days.innerText !== d.toString().padStart(2, '0')) {
                els.days.innerText = d.toString().padStart(2, '0');
                pulseElement(items.days);
            }

            let progress = 100 - (distance / maxTimeMs * 100);
            if (progress < 5) progress = 5;
            if (progress > 100) progress = 100;
            els.vine.style.width = `${progress}%`;
        }

        async function initConfig() {
            try {
                const response = await fetch('/api/public/config', { headers: { 'Accept': 'application/json' } });
                if (!response.ok) throw new Error(response.statusText);
                const config = await response.json();
                
                isEnabled = config.countdown_enabled !== false;
                if (isEnabled && config.scheduled_at) {
                    const ms = Date.parse(config.scheduled_at);
                    if (!isNaN(ms)) {
                        targetDate = ms;
                        const dateObj = new Date(ms);
                        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                        els.dateDisplay.innerText = "Inauguration on " + dateObj.toLocaleDateString(undefined, options) + " · your local time";
                    } else {
                        isEnabled = false;
                    }
                } else {
                    isEnabled = false;
                }
            } catch (err) {
                targetDate = Date.now() + (7 * 24 * 60 * 60 * 1000) + (4 * 60 * 60 * 1000);
                isEnabled = true;
                const dateObj = new Date(targetDate);
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                els.dateDisplay.innerText = "Inauguration on " + dateObj.toLocaleDateString(undefined, options);
            }

            if (!isEnabled) {
                els.container.style.display = 'none';
                els.message.style.display = 'block';
                els.message.innerText = 'The roots are growing. Stay tuned.';
                els.vine.style.width = '100%';
            } else {
                updateCountdown();
                countdownInterval = setInterval(updateCountdown, 1000);
            }
        }

        initConfig();
    </script>
</body>
</html>
