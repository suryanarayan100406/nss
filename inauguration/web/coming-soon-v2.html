<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Unveiling | NSS IIIT Naya Raipur</title>
    <style>
        :root {
            --ink: #0F1712;
            --pine: #182620;
            --pine-2: #20342A;
            --pine-3: #2A4A38;
            --moss: #4A6647;
            --leaf: #7FA56A;
            --marigold: #E8A63C;
            --marigold-dim: #C98A2C;
            --rust: #B6432A;
            --paper: #F1ECDC;
            --bone: #F5F1E4;
            --bone-dim: rgba(245, 241, 228, 0.72);
            --line-on-dark: rgba(245, 241, 228, 0.16);
            --font-display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
            --font-body: 'Work Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        @font-face {
            font-family: 'Fraunces';
            src: url('../../assets/fonts/fraunces-latin-wght-normal.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Fraunces';
            src: url('../../assets/fonts/fraunces-latin-wght-italic.woff2') format('woff2');
            font-weight: 400;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'Work Sans';
            src: url('../../assets/fonts/work-sans-latin-wght-normal.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--ink);
            color: var(--bone);
            font-family: var(--font-body);
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* Film grain */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            opacity: 0.04;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        /* Glowing border frame */
        .frame {
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            bottom: 1rem;
            border: 1px solid var(--line-on-dark);
            pointer-events: none;
            z-index: 900;
            border-radius: 8px;
            box-shadow: inset 0 0 40px rgba(232, 166, 60, 0.05);
            transition: all 0.3s ease;
        }

        /* Canvas for particles */
        #cosmic-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Background Portal */
        .portal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(232, 166, 60, 0.15) 0%, rgba(24, 38, 32, 0.4) 40%, transparent 70%);
            z-index: 1;
            pointer-events: none;
            animation: pulsePortal 8s ease-in-out infinite alternate;
            filter: blur(40px);
        }

        @keyframes pulsePortal {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        /* Header / Logos */
        .header {
            position: absolute;
            top: 3rem;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeUp 1s ease-out 0.2s forwards;
            z-index: 20;
        }

        .logo {
            height: 50px;
            width: auto;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(232, 166, 60, 0.2);
            transition: transform 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.05);
        }

        .org-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .org-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--bone-dim);
            margin: 0;
        }

        .org-subtitle {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--marigold-dim);
            margin: 0;
        }

        /* Typography */
        h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 400;
            margin: 1rem 0;
            line-height: 1.1;
            opacity: 0;
            transform: scale(0.95);
            animation: fadeInScale 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
        }

        h1 em {
            color: var(--marigold);
            font-style: italic;
            position: relative;
            display: inline-block;
            background: linear-gradient(to right, var(--marigold), var(--bone), var(--marigold));
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmerText 5s linear infinite;
        }

        @keyframes shimmerText {
            0% { background-position: -100% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--bone-dim);
            max-width: 600px;
            margin: 0 auto 3rem;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease-out 0.8s forwards;
        }

        /* Countdown */
        .countdown-wrapper {
            display: flex;
            gap: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease-out 1.1s forwards;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(24, 38, 32, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line-on-dark);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            min-width: 100px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .time-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--marigold), transparent);
            opacity: 0.5;
        }

        .time-val {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--bone);
            margin-bottom: 0.25rem;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .time-val.flip {
            transform: scale(1.1) translateY(-5px);
            color: var(--marigold);
            text-shadow: 0 0 10px rgba(232, 166, 60, 0.5);
        }

        .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--marigold-dim);
        }

        #status-message {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--marigold);
            font-style: italic;
            display: none;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        .date-display {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--bone-dim);
            letter-spacing: 0.05em;
            opacity: 0;
            animation: fadeUp 1s ease-out 1.3s forwards;
        }

        /* Floating badges */
        .badge {
            position: absolute;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: rgba(42, 74, 56, 0.3);
            border: 1px solid rgba(232, 166, 60, 0.2);
            color: var(--marigold);
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 15;
            animation: floatBadge 4s ease-in-out infinite alternate;
        }

        .badge-1 { top: 20%; left: 15%; animation-delay: 0s; }
        .badge-2 { bottom: 25%; right: 15%; animation-delay: -2s; background: rgba(74, 102, 71, 0.2); border-color: rgba(127, 165, 106, 0.3); color: var(--leaf); }

        @keyframes floatBadge {
            0% { transform: translateY(0px) rotate(-2deg); }
            100% { transform: translateY(-15px) rotate(2deg); }
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: var(--bone-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 1s ease-out 1.5s forwards;
            z-index: 20;
        }

        /* Scroll indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, var(--marigold), transparent);
            opacity: 0;
            animation: fadeUp 1s ease-out 1.7s forwards, pulseLine 2s infinite 2.5s;
        }

        @keyframes pulseLine {
            0% { height: 40px; opacity: 0.3; transform: translateX(-50%) translateY(0); }
            50% { height: 60px; opacity: 1; transform: translateX(-50%) translateY(-5px); }
            100% { height: 40px; opacity: 0.3; transform: translateX(-50%) translateY(0); }
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Parallax Container */
        #parallax-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @media (max-width: 768px) {
            .countdown-wrapper { gap: 0.5rem; }
            .time-box { min-width: 70px; padding: 0.75rem 1rem; }
            .time-val { font-size: 1.8rem; }
            .header { top: 2rem; flex-direction: column; gap: 1rem; }
            .badge { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .portal { animation: none; }
            #cosmic-canvas { display: none; }
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div class="frame"></div>
    <canvas id="cosmic-canvas"></canvas>
    <div class="portal"></div>

    <div class="container">
        <header class="header">
            <img src="../../nss_logo.jpg" alt="NSS Logo" class="logo">
            <div class="org-info">
                <p class="org-title">National Service Scheme</p>
                <p class="org-subtitle">IIIT Naya Raipur</p>
            </div>
            <img src="../../assets/images/iiit.png" alt="IIIT Logo" class="logo" style="background: white;">
        </header>

        <div id="parallax-wrapper">
            <div class="badge badge-1">Entering Orbit</div>
            <div class="badge badge-2">Systems Online</div>

            <h1>The <em>Unveiling</em></h1>
            <p class="subtitle">A new digital frontier for NSS IIIT Naya Raipur is emerging from the cosmic void. Prepare for the launch.</p>

            <div id="countdown-container" class="countdown-wrapper">
                <div class="time-box">
                    <span class="time-val" id="cd-days">00</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="cd-hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="cd-minutes">00</span>
                    <span class="time-label">Mins</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="cd-seconds">00</span>
                    <span class="time-label">Secs</span>
                </div>
            </div>
            
            <div id="status-message">The ceremony is about to begin.</div>

            <div class="date-display" id="local-date">Target Date: TBD</div>
        </div>

        <div class="scroll-indicator"></div>

        <footer>IIIT Naya Raipur</footer>
    </div>

    <script>
        // --- Parallax Effect ---
        const wrapper = document.getElementById('parallax-wrapper');
        const portal = document.querySelector('.portal');
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) / 40;
            mouseY = (e.clientY - window.innerHeight / 2) / 40;
        });

        function updateParallax() {
            targetX += (mouseX - targetX) * 0.1;
            targetY += (mouseY - targetY) * 0.1;
            
            if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                wrapper.style.transform = `translate(${targetX}px, ${targetY}px)`;
                portal.style.transform = `translate(calc(-50% + ${targetX * 2}px), calc(-50% + ${targetY * 2}px)) scale(1)`;
            }
            requestAnimationFrame(updateParallax);
        }
        updateParallax();

        // --- Canvas Particle System ---
        const canvas = document.getElementById('cosmic-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;
        
        let pointer = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => {
            pointer.x = e.x;
            pointer.y = e.y;
        });
        window.addEventListener('mouseout', () => {
            pointer.x = null;
            pointer.y = null;
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.color = Math.random() > 0.8 ? '#E8A63C' : '#F5F1E4';
                this.opacity = Math.random() * 0.5 + 0.2;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            update() {
                // Drift
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // Mouse interaction
                if (pointer.x != null) {
                    let dx = pointer.x - this.x;
                    let dy = pointer.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = pointer.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < maxDistance) {
                        this.x -= directionX * 0.5;
                        this.y -= directionY * 0.5;
                    } else {
                        if (this.x !== this.baseX) {
                            let dxBase = this.x - this.baseX;
                            this.x -= dxBase / 100;
                        }
                        if (this.y !== this.baseY) {
                            let dyBase = this.y - this.baseY;
                            this.y -= dyBase / 100;
                        }
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            const numParticles = Math.min((canvas.width * canvas.height) / 8000, 150);
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function connect() {
            let maxDistance = 120;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        let opacity = 1 - (distance / maxDistance);
                        ctx.strokeStyle = `rgba(232, 166, 60, ${opacity * 0.2})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].draw();
                particles[i].update();
            }
            connect();
            animationFrameId = requestAnimationFrame(animate);
        }

        if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            resize();
            animate();
        }

        // --- Countdown Logic ---
        let targetDate = new Date().getTime() + (7 * 24 * 60 * 60 * 1000); // Fallback: 7 days
        let countdownInterval;
        let isEnabled = true;

        const els = {
            days: document.getElementById('cd-days'),
            hours: document.getElementById('cd-hours'),
            mins: document.getElementById('cd-minutes'),
            secs: document.getElementById('cd-seconds'),
            container: document.getElementById('countdown-container'),
            msg: document.getElementById('status-message'),
            dateDisplay: document.getElementById('local-date')
        };
        
        let prevValues = { d: -1, h: -1, m: -1, s: -1 };

        function updateElement(el, val, key) {
            const strVal = val < 10 ? '0' + val : val;
            if (prevValues[key] !== val) {
                el.classList.remove('flip');
                void el.offsetWidth; // trigger reflow
                el.innerText = strVal;
                el.classList.add('flip');
                prevValues[key] = val;
            }
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                clearInterval(countdownInterval);
                els.container.style.display = 'none';
                els.msg.style.display = 'block';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            updateElement(els.days, days, 'd');
            updateElement(els.hours, hours, 'h');
            updateElement(els.mins, minutes, 'm');
            updateElement(els.secs, seconds, 's');
        }

        function startTimer() {
            if (countdownInterval) clearInterval(countdownInterval);
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }

        async function fetchConfig() {
            try {
                // Attempt to fetch from API
                const response = await fetch('/api/public/config');
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.scheduled_at) {
                        targetDate = new Date(data.scheduled_at).getTime();
                        
                        // Format local date for display
                        const d = new Date(targetDate);
                        els.dateDisplay.innerText = `Target Date: ${d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} ${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit'})}`;
                    }

                    if (typeof data.countdown_enabled !== 'undefined') {
                        isEnabled = data.countdown_enabled;
                    }
                }
            } catch (err) {
                console.warn('Failed to fetch config, using fallback date', err);
                // Set fallback local date
                const d = new Date(targetDate);
                els.dateDisplay.innerText = `Target Date: ${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;
            }

            if (!isEnabled) {
                els.container.style.display = 'none';
                els.dateDisplay.style.display = 'none';
                els.msg.innerText = "Stay tuned for updates.";
                els.msg.style.display = 'block';
            } else {
                startTimer();
            }
        }

        fetchConfig();
    </script>
</body>
</html>
