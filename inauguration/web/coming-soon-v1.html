<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title>NSS — IIIT Naya Raipur</title>
<meta name="description" content="The National Service Scheme unit at IIIT Naya Raipur — our website unveils at the inauguration.">
<meta name="theme-color" content="#0F1712">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<style id="coming-soon-css">
  /* ===== Holding page =====
     Sits on the same tokens as the main site (css/style.css:16-41) so the unveiling
     is a reveal of the real thing rather than a change of identity. Nothing here is
     loaded from off-site: the fonts are the vendored ones. */

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }

  .cs-stage {
    position: relative;
    min-height: 100svh;
    /* Two rows: the crest and countdown take the slack and stay centred, the footer
       sits on its own line beneath them. Positioning it absolutely instead would let
       it sit on top of the countdown on a short laptop screen. */
    display: grid;
    grid-template-rows: 1fr auto;
    align-items: center;
    justify-items: center;
    padding: clamp(24px, 4vw, 48px) 0 clamp(16px, 2.4vw, 26px);
    isolation: isolate;
  }

  /* style.css:208 paints every <main> the paper colour, because every <main> on the
     real site is a light section. This page is the dark holding screen, so the stage
     has to opt out and let the body's ink show through — without this the whole page
     renders cream-on-cream and the countdown is unreadable. */
  main.cs-stage { background: none; }

  /* A single warm light behind the crest — the same marigold the site uses for
     emphasis, at very low opacity, so the page reads as lit rather than flat. */
  .cs-stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(58% 46% at 50% 32%, rgba(232, 166, 60, 0.16), transparent 68%),
      radial-gradient(90% 70% at 50% 110%, rgba(42, 74, 56, 0.55), transparent 70%);
  }

  .cs-core { text-align: center; }

  .cs-logo {
    width: clamp(74px, 11vw, 104px);
    height: auto;
    border-radius: 50%;
    display: block;
    margin: 0 auto clamp(20px, 3vw, 30px);
    box-shadow: 0 0 0 1px var(--line-on-dark), 0 18px 46px rgba(0, 0, 0, 0.42);
  }

  .cs-org,
  .cs-org-sub {
    margin: 0;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    font-size: clamp(10px, 1.1vw, 12px);
    color: var(--bone-dim);
  }
  .cs-org { color: var(--marigold); }
  .cs-org-sub { margin-top: 7px; }

  .cs-rule {
    width: clamp(48px, 7vw, 78px);
    height: 1px;
    margin: clamp(22px, 3.4vw, 32px) auto;
    background: linear-gradient(90deg, transparent, var(--marigold-dim), transparent);
  }

  .cs-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(38px, 8.4vw, 92px);
    line-height: 1.02;
    letter-spacing: -0.022em;
    margin: 0;
    color: var(--bone);
  }
  .cs-title em {
    font-style: italic;
    color: var(--marigold);
  }

  .cs-lede {
    max-width: 46ch;
    margin: clamp(18px, 2.6vw, 26px) auto 0;
    font-size: clamp(14px, 1.5vw, 16.5px);
    line-height: 1.7;
    color: var(--bone-dim);
  }

  /* ---- countdown ---- */

  .cs-count {
    display: flex;
    justify-content: center;
    gap: clamp(10px, 2.4vw, 26px);
    margin-top: clamp(34px, 5vw, 54px);
  }
  .cs-count[hidden] { display: none; }

  .cs-cell {
    min-width: clamp(62px, 15vw, 104px);
    padding: clamp(12px, 1.9vw, 18px) clamp(8px, 1.4vw, 14px);
    border: 1px solid var(--line-on-dark);
    border-radius: 14px;
    background: rgba(245, 241, 228, 0.035);
  }

  .cs-num {
    display: block;
    font-family: var(--font-display);
    font-variant-numeric: tabular-nums;
    font-size: clamp(26px, 5.4vw, 46px);
    line-height: 1;
    color: var(--bone);
  }

  .cs-lab {
    display: block;
    margin-top: 9px;
    font-size: clamp(9px, 1vw, 10.5px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--bone-dim);
  }

  /* ---- the lines under the counter ---- */

  .cs-when,
  .cs-note {
    margin: clamp(20px, 2.8vw, 28px) auto 0;
    font-size: clamp(12px, 1.3vw, 14px);
    line-height: 1.65;
    color: var(--bone-dim);
    max-width: 52ch;
  }
  .cs-when strong { color: var(--bone); font-weight: 500; }
  .cs-note { margin-top: 10px; opacity: 0.72; }

  /* The zero state: the counter is gone and the page says the ceremony is due. */
  .cs-ready {
    font-family: var(--font-display);
    font-size: clamp(19px, 2.6vw, 27px);
    color: var(--marigold);
    margin-top: clamp(30px, 4.4vw, 46px);
    line-height: 1.45;
  }
  .cs-ready[hidden] { display: none; }

  .cs-foot {
    justify-self: stretch;
    text-align: center;
    margin-top: clamp(18px, 3vw, 30px);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--bone-dim);
    opacity: 0.5;
  }

  @media (prefers-reduced-motion: reduce) {
    .cs-stage::before { background: radial-gradient(58% 46% at 50% 32%, rgba(232, 166, 60, 0.12), transparent 68%); }
  }
</style>
</head>
<body>

<main class="cs-stage">
  <div class="wrap cs-core">

    <img class="cs-logo" src="nss_logo.jpg" alt="NSS IIIT Naya Raipur" width="104" height="104">

    <p class="cs-org">National Service Scheme</p>
    <p class="cs-org-sub">IIIT Naya Raipur</p>

    <div class="cs-rule" role="presentation"></div>

    <h1 class="cs-title">The <em>Unveiling</em></h1>

    <p class="cs-lede">
      The National Service Scheme unit at IIIT Naya Raipur is putting its work online.
      Not long now.
    </p>

    <p class="cs-ready" id="ready" hidden>
      The ceremony is about to begin.
    </p>

    <div class="cs-count" id="count" role="timer" aria-live="off" hidden>
      <div class="cs-cell"><span class="cs-num" id="d">—</span><span class="cs-lab">Days</span></div>
      <div class="cs-cell"><span class="cs-num" id="h">—</span><span class="cs-lab">Hours</span></div>
      <div class="cs-cell"><span class="cs-num" id="m">—</span><span class="cs-lab">Minutes</span></div>
      <div class="cs-cell"><span class="cs-num" id="s">—</span><span class="cs-lab">Seconds</span></div>
    </div>

    <p class="cs-when" id="when"></p>
    <p class="cs-note" id="note"></p>

  </div>

  <p class="cs-foot">IIIT Naya Raipur</p>
</main>

<script>
(function () {
  'use strict';

  var countEl = document.getElementById('count');
  var readyEl = document.getElementById('ready');
  var whenEl  = document.getElementById('when');
  var noteEl  = document.getElementById('note');
  var cells = {
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    m: document.getElementById('m'),
    s: document.getElementById('s')
  };

  var timer = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* The target is an absolute instant.
     scheduled_at carries its own UTC offset (+05:30), so Date.parse resolves it to a
     fixed point in time and the countdown is identical for a visitor in Raipur and
     one in London — only the "your local time" line below differs. */
  function targetFrom(isoString) {
    var ms = Date.parse(isoString);
    return isNaN(ms) ? null : ms;
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function showReady(message) {
    stop();
    countEl.hidden = true;
    readyEl.hidden = false;
    if (message) readyEl.textContent = message;
  }

  function render(target) {
    var left = target - Date.now();

    if (left <= 0) {
      showReady('The ceremony is about to begin.');
      noteEl.textContent = '';
      return;
    }

    countEl.hidden = false;
    readyEl.hidden = true;

    var totalSeconds = Math.floor(left / 1000);
    cells.d.textContent = String(Math.floor(totalSeconds / 86400));
    cells.h.textContent = pad(Math.floor(totalSeconds / 3600) % 24);
    cells.m.textContent = pad(Math.floor(totalSeconds / 60) % 60);
    cells.s.textContent = pad(totalSeconds % 60);

    var secs = totalSeconds % 60;
    if (secs === 0) noteEl.textContent = 'Counting down, live.';
  }

  function describe(target, isoString) {
    var local = new Date(target);
    var parts = [];
    try {
      parts.push(local.toLocaleString(undefined, {
        weekday: 'long', day: 'numeric', month: 'long',
        hour: '2-digit', minute: '2-digit'
      }));
    } catch (e) {
      parts.push(local.toString());
    }
    whenEl.innerHTML = 'Inauguration on <strong>' + parts[0] + '</strong> · your local time';

    // The scheduled instant is fixed in IST; say so plainly rather than making the
    // visitor work out whether the time they are shown is theirs or ours.
    var ist = isIstMidMorning(isoString);
    if (ist) noteEl.textContent = 'That is 10:15 AM IST — the ceremony is scheduled in Indian Standard Time.';
  }

  function isIstMidMorning(isoString) {
    return /\+05:30$/.test(String(isoString).trim());
  }

  function start(target, isoString) {
    describe(target, isoString);
    render(target);
    stop();
    // Once a second is plenty: the displayed resolution is one second, and a
    // faster tick only burns a phone battery in the visitor's pocket.
    timer = setInterval(function () { render(target); }, 1000);
  }

  function fallback() {
    // The holding page must still read as intentional when the API cannot be
    // reached — it is the page everyone sees before the ceremony.
    whenEl.textContent = '';
    noteEl.textContent = '';
    showReady('The ceremony is about to begin.');
  }

  function load() {
    var request;
    try {
      request = fetch('/api/public/config', { headers: { 'Accept': 'application/json' } });
    } catch (e) {
      fallback();
      return;
    }

    request
      .then(function (response) {
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      })
      .then(function (config) {
        // Nothing here writes anything. The holding page reports the state; it never
        // sets it, and a zero countdown does not start the ceremony.
        if (config.countdown_enabled === false) {
          whenEl.textContent = '';
          noteEl.textContent = '';
          showReady('The ceremony is about to begin.');
          return;
        }
        var target = targetFrom(config.scheduled_at);
        if (target === null) { fallback(); return; }
        start(target, config.scheduled_at);
      })
      .catch(fallback);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', load);
  } else {
    load();
  }
})();
</script>
</body>
</html>
