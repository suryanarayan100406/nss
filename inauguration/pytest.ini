[pytest]
testpaths = tests

# Report the slowest tests on every run. Several of these drive real bash scripts
# against a sandboxed copy of the production layout, so the slow ones are the
# interesting ones and are worth naming without having to ask for them.
addopts = -q --durations=15

# A stalled test must name itself. Without this, one hung child process consumed 90
# minutes of wall clock and the only thing reported was "1 failed" — the run looked
# like ordinary contention rather than a hang. This dumps the traceback of every
# thread when a single test exceeds the limit. It does not abort the run: the test is
# allowed to finish, so a slow-but-correct test is never turned into a failure.
faulthandler_timeout = 300
